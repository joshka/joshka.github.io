<!doctype html>
<!-- Template for page share cards. Rendered by scripts/og/render.sh with ?title=...&lead=...&points=a|b|c -->
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fira Code';
    src: url('../../static/fonts/FiraCode-VF.woff2') format('woff2');
    font-weight: 300 700;
  }

  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #0a0e17;
    color: #eef0f5;
    font-family: 'Fira Code', monospace;
  }

  .card {
    box-sizing: border-box;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    border-top: 6px solid #76a8f2;
  }

  .site { font-size: 30px; font-weight: 700; }
  .site span { color: #76a8f2; }
  h1 { margin: 56px 0 18px; font-size: 76px; line-height: 1.05; }
  .lead { margin: 0; font-size: 30px; color: #8f98ab; line-height: 1.4; max-width: 980px; }
  ul { margin: auto 0 0; padding: 0; list-style: none; display: flex; gap: 18px; flex-wrap: wrap; }
  li { padding: 10px 20px; border: 2px solid #2a3443; border-radius: 999px; font-size: 24px; color: #52c4c0; background: #121925; }
</style>
<div class="card">
  <div class="site"><span>~/</span>joshka.net</div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <ul id="points"></ul>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("title").textContent = q.get("title");
  document.getElementById("lead").textContent = q.get("lead");
  for (const p of (q.get("points") || "").split("|").filter(Boolean)) {
    const li = document.createElement("li");
    li.textContent = p;
    document.getElementById("points").append(li);
  }
</script>
