name: Zola Deploy Action

on:
  push:
    branches:
    - main
  # Pushes made with GITHUB_TOKEN don't trigger workflows, so deploy after each stats refresh
  workflow_run:
    workflows: ["Refresh project stats"]
    types: [completed]
jobs:
  build:
    name: Deploy site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Build and Deploy
        uses: shalzz/zola-deploy-action@v0.23.1
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Provide personal access token
          # TOKEN: ${{ secrets.TOKEN }}
          # Or if publishing to the same repo, use the automatic token
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
