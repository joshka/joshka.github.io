# The URL the site will be built for
base_url = "https://www.joshka.net"

# The site title and description; used in feeds by default.
title = "Joshka.net"
description = "Josh McKinney's personal website"
author = "Josh McKinney"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

taxonomies = [{ name = "tags" }]

# When set to "true", a feed is automatically generated.
generate_feeds = true

[markdown]

[markdown.highlighting]
dark_theme = "aardvark-ink"
light_theme = "aardvark-paper"
extra_themes = ["highlighting/aardvark-ink.json", "highlighting/aardvark-paper.json"]

[extra]
logo_text = "joshka.net"
author = "Josh McKinney"

# $BASE_URL is replaced with base_url; newtab opens the link in a new tab
menu_items = [
    { name = "writing", url = "$BASE_URL/writing" },

    # tags should only be enabled if you have "tags" taxonomy
    # see documentation below for more details
    # { name = "tags", url = "$BASE_URL/tags" },
    { name = "about", url = "$BASE_URL/about" },
    { name = "resume", url = "$BASE_URL/resume" },
    { name = "projects", url = "$BASE_URL/projects" },

    # set newtab to true to make the link open in new tab
    { name = "github", icon = "github", url = "https://github.com/joshka", newtab = true, external = true },
    { name = "linkedin", icon = "linkedin", url = "https://www.linkedin.com/in/joshka", newtab = true, external = true },
    { name = "mastodon", icon = "mastodon", url = "https://hachyderm.io/@joshka", newtab = true, external = true },
    { name = "bluesky", icon = "bluesky", url = "https://bsky.app/profile/joshka.net", newtab = true, external = true },
    { name = "x", icon = "x", url = "https://x.com/joshuamck", newtab = true, external = true },
    { name = "soundcloud", icon = "soundcloud", url = "https://soundcloud.com/joshka", newtab = true, external = true },

]

[link_checker]
# LinkedIn answers automated requests with status 999, so its links can't be checked
skip_prefixes = ["https://www.linkedin.com/"]
