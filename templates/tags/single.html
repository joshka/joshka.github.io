{% extends "base.html" %}

{% block content %}
<div class="post">
    <h1 class="post-title">
        tag: #{{ term.name }}
        ({{ term.pages | length }} post{{ term.pages | length | pluralize }})
    </h1>
    <a href="{{ config.base_url | safe }}/tags/">Show all tags</a>
    {{ <post_list pages={term.pages} /> }}
</div>
{% endblock content %}
