{% extends "base.html" %}

{% block content %}
<div class="post">
    <h1 class="post-title">Tags</h1>
    <div class="post-content">
        <div class="project-chips">
        {%- for term in terms %}
            <a href="{{ term.permalink | safe }}">#{{ term.name }} <span class="chip-count">{{ term.pages | length }}</span></a>
        {%- endfor %}
        </div>
    </div>
</div>
{% endblock content %}
